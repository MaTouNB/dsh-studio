# DSH Studio release: from a desktop-v* tag, rebuild both installers on their
# native runners (same matrix as the pull-request drill), then a single
# release job with write permission creates a draft GitHub release carrying
# the installers, SHA256SUMS.txt, and both runtime manifests. No other job in
# this workflow can write repository contents, and the tag filter admits only
# desktop-v* tags.
name: Release (DSH Studio)

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: mac-arm64
            package: package:mac
            smoke: smoke:mac
          - name: Windows x64
            os: windows-2025
            platform: win-x64
            package: package:win
            smoke: smoke:installed:win
    steps:
      # Complete history and tags: the release verification reads the tag name.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron-builder
            ~/Library/Caches/electron
            $LOCALAPPDATA/electron-builder/Cache
            $LOCALAPPDATA/electron/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('apps/desktop/package.json') }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace artifacts
        run: pnpm run build

      - name: Stage the runtime
        run: pnpm --filter @deepseek-ai/dsh-desktop run stage

      - name: Package the installer
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.package }}

      - name: Write checksums
        run: pnpm --filter @deepseek-ai/dsh-desktop run checksums

      - name: Verify release facts
        env:
          DESKTOP_RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run verify:release -- --platform=${{ matrix.platform }}

      - name: Smoke the built artifact
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.smoke }}

      - name: Copy runtime manifest
        run: cp apps/desktop/staging/${{ matrix.platform }}/runtime-manifest.json apps/desktop/dist/runtime-manifest-${{ matrix.platform }}.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-studio-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/SHA256SUMS.txt
            apps/desktop/dist/runtime-manifest-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-24.04
    # The only job in the sequence that can write repository contents; the
    # build matrix above runs with contents: read.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-studio-*
          merge-multiple: true
          path: dist

      - name: Assemble release facts
        id: facts
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#desktop-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          harness_version=$(node -e "const m=require('./dist/runtime-manifest-mac-arm64.json'); process.stdout.write(m.components?.dsh?.version ?? 'unknown')")
          echo "harness_version=$harness_version" >> "$GITHUB_OUTPUT"
          docs="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/runtime-manifest-mac-arm64.json
            dist/runtime-manifest-win-x64.json
          body: |
            # DSH Studio ${{ steps.facts.outputs.version }}

            DSH Studio brings the DeepSeek Harness Web UI, runtime, and plugin management into a desktop application.

            ## Downloads

            - **macOS arm64:** `DSH Studio-${{ steps.facts.outputs.version }}-mac-arm64.dmg`
            - **Windows x64:** `DSH Studio-${{ steps.facts.outputs.version }}-win-x64.exe`

            ## Highlights

            - Bundled Harness Web UI and pinned runtime
            - Supervised startup, restart, crash recovery, and diagnostics
            - Discover and Manage views for Harness plugins
            - Runtime manifests and `SHA256SUMS.txt` for both platforms

            Bundled Harness version: `${{ steps.facts.outputs.harness_version }}`. Verify downloads with `SHA256SUMS.txt`. These alpha packages are unsigned; installation details are in the [download guide](${{ steps.facts.outputs.docs }}/apps/desktop/docs/download.md) and [security notes](${{ steps.facts.outputs.docs }}/apps/desktop/docs/security.md).

            ---

            DSH Studio 将 DeepSeek Harness Web UI、运行时和插件管理带到桌面端。

            ## 下载

            - **macOS arm64：** `DSH Studio-${{ steps.facts.outputs.version }}-mac-arm64.dmg`
            - **Windows x64：** `DSH Studio-${{ steps.facts.outputs.version }}-win-x64.exe`

            ## 主要功能

            - 内置 Harness Web UI 与固定版本运行时
            - 启动托管、重启、崩溃恢复与诊断导出
            - Harness 插件「发现」与「管理」界面
            - 双平台运行时清单与 `SHA256SUMS.txt`

            内置 Harness 版本：`${{ steps.facts.outputs.harness_version }}`。请使用 `SHA256SUMS.txt` 校验下载文件。alpha 安装包尚未签名；安装方法见[下载指南](${{ steps.facts.outputs.docs }}/apps/desktop/docs/download.zh.md)与[安全说明](${{ steps.facts.outputs.docs }}/apps/desktop/docs/security.zh.md)。
